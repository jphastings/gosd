# Releases every package prepared by the merged knope/release PR: creates the
# per-package tags and GitHub releases (with notes from the changelog diff).
# The artifacts/npm pipelines fire from those tags. Runs via KNOPE_PAT so the
# created tags trigger them.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: github.head_ref == 'knope/release' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.KNOPE_PAT }}
      - name: Configure Git # knope creates the plain Go-module tag locally, which needs a tagger identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.KNOPE_PAT }}
      # knope creates release tags (gosd/v*, artifacts/v*, npm/gosd/v*) via
      # the GitHub API, but the plain vX.Y.Z Go-module tag only locally.
      - name: Push the Go module tag
        run: git push origin --tags
