# Warns when curl.se publishes a newer Mozilla CA bundle snapshot than the
# one internal/cacerts.Pin points at (bean gosd-w6zc). gosd-6zd1's option-B
# analysis predicted this obligation: baking the bundle into every image
# (gosd-kzgq) means roots now age with gosd releases, and nothing else
# notices when curl.se rotates its snapshot (Mozilla updates roughly
# quarterly; removals matter more than additions, since a distrusted CA
# stays trusted on-device until a pin bump ships).
#
# This job is warn-only by design: it never edits internal/cacerts and never
# fails a build. On a mismatch it opens (or refreshes, if one is already
# open) a single tracking issue named after the newer dated snapshot. The
# sha256 it compares against is read out of internal/cacerts/cacerts.go at
# run time — never hardcoded here — so this check can't itself go stale.
# The bump procedure stays the two-constant edit documented in that
# package's doc comment.
name: CA pin freshness check

on:
  schedule:
    # Mozilla's bundle updates roughly quarterly; weekly is cheap and finds
    # a new snapshot well within that cadence.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-pin:
    name: compare internal/cacerts.Pin against curl.se
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read the pinned sha256 out of internal/cacerts
        id: pin
        run: |
          pinned="$(sed -n 's/.*SHA256:[[:space:]]*"\([0-9a-f]\{64\}\)".*/\1/p' internal/cacerts/cacerts.go)"
          if [ -z "$pinned" ]; then
            echo "::error::could not extract Pin.SHA256 from internal/cacerts/cacerts.go; has its shape changed?" >&2
            exit 1
          fi
          echo "sha256=$pinned" >> "$GITHUB_OUTPUT"

      - name: Fetch curl.se's current rolling snapshot sha256
        id: remote
        run: |
          remote="$(curl -fsSL https://curl.se/ca/cacert.pem.sha256 | awk '{print $1}')"
          if [ -z "$remote" ]; then
            echo "::error::could not fetch or parse https://curl.se/ca/cacert.pem.sha256" >&2
            exit 1
          fi
          echo "sha256=$remote" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        env:
          PINNED: ${{ steps.pin.outputs.sha256 }}
          REMOTE: ${{ steps.remote.outputs.sha256 }}
        run: |
          if [ "$PINNED" = "$REMOTE" ]; then
            echo "up to date: internal/cacerts.Pin matches curl.se's current snapshot"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale: internal/cacerts.Pin no longer matches curl.se's current snapshot"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Best-effort only: names the newest cacert-YYYY-MM-DD.pem for the
      # issue title. https://curl.se/ca/ itself is just a redirect stub (no
      # directory listing) - the dated names live in the changelog at
      # /docs/caextract.html instead; sorting its matches works because
      # YYYY-MM-DD sorts chronologically as plain text. If curl.se's page
      # ever changes shape and this comes up empty, the issue still carries
      # the raw sha256es below, which are what actually matters for the bump.
      - name: Find the newest dated snapshot name, for the issue title
        if: steps.compare.outputs.stale == 'true'
        id: snapshot
        run: |
          name="$(curl -fsSL https://curl.se/docs/caextract.html | grep -oE 'cacert-[0-9]{4}-[0-9]{2}-[0-9]{2}\.pem' | sort -u | tail -1)"
          if [ -z "$name" ]; then
            name="an unnamed newer snapshot (could not read https://curl.se/docs/caextract.html - see the sha256 below)"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Dedupe on a fixed title prefix, not a label: re-runs while still
      # stale refresh the same issue (its title tracks whatever the newest
      # snapshot is right now) instead of piling up duplicates. Once the pin
      # is bumped, `compare` above stops firing and the issue is left for a
      # human to close.
      - name: Open or refresh the tracking issue
        if: steps.compare.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: "cacerts pin stale:"
          SNAPSHOT: ${{ steps.snapshot.outputs.name }}
          PINNED_SHA: ${{ steps.pin.outputs.sha256 }}
          REMOTE_SHA: ${{ steps.remote.outputs.sha256 }}
        run: |
          title="$TITLE_PREFIX curl.se now serves $SNAPSHOT"
          body="$(cat <<EOF
          curl.se's rolling \`https://curl.se/ca/cacert.pem.sha256\` no longer
          matches \`internal/cacerts.Pin.SHA256\` - a newer Mozilla CA bundle
          snapshot is available.

          - Pinned sha256: \`$PINNED_SHA\`
          - curl.se's current sha256: \`$REMOTE_SHA\`
          - Newest dated snapshot found at https://curl.se/docs/caextract.html: \`$SNAPSHOT\`

          This is a warn-only check (bean gosd-w6zc, workflow
          \`.github/workflows/cacerts-pin-check.yml\`) - nothing was changed
          automatically. To bump the pin, follow the two-constant edit
          documented in \`internal/cacerts\`'s package doc comment: pick the
          newest dated snapshot listed at https://curl.se/ca/, verify its
          sha256 against curl.se's published \`<name>.sha256\`, and update
          \`Pin\`'s URL and SHA256 together.

          Safe to close once bumped - a future mismatch opens a fresh issue.
          EOF
          )"

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE_PREFIX\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "refreshing existing issue #$existing"
            gh issue edit "$existing" --title "$title" --body "$body"
          else
            echo "opening a new issue"
            gh issue create --title "$title" --body "$body"
          fi
