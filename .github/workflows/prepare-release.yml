# Maintains the release PR (branch knope/release) whenever main has pending
# change files. Merging that PR runs release.yml, which tags and publishes.
# Auth is a self-owned GitHub App (Contents RW + Pull requests RW, this repo
# only): the knope-release environment — readable only by runs on main —
# holds its key, and each run mints a 1-hour auto-revoked installation
# token, so the PR (and later the tags) trigger other workflows without any
# long-lived credential in reach of a branch build.
name: Prepare release PR

on:
  push:
    branches: [main]

permissions: {}

jobs:
  prepare-release:
    # Exact complement of release.yml's push-triggered guard (its
    # workflow_dispatch trigger has no push counterpart here, so it isn't
    # part of this complement). Widened the same way release.yml's guard
    # is: a release-PR merge commit's message carries either the PR's title
    # ("chore: prepare release", on a squash merge) or the default
    # merge-commit subject's branch name ("knope/release", on the default
    # "Create a merge commit" button) — see release.yml and
    # docs/releasing.md. This guard is belt-and-suspenders, not the real
    # safety net: the "Check for pending change files" step below already
    # no-ops cleanly when nothing's pending, which is what actually
    # protects a false-negative match here.
    if: "!(contains(github.event.head_commit.message, 'chore: prepare release') || contains(github.event.head_commit.message, 'knope/release'))"
    runs-on: ubuntu-latest
    environment: knope-release
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.KNOPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KNOPE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # Skip cleanly when nothing is pending: knope's PrepareRelease has no
      # no-op mode — with zero change files the workflow would fail at the
      # empty `git commit`.
      - name: Check for pending change files
        id: pending
        run: compgen -G ".changeset/*.md" > /dev/null && echo "pending=true" >> "$GITHUB_OUTPUT" || true
      - name: Configure Git as the app bot
        if: steps.pending.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" --jq .id)"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.pending.outputs.pending == 'true'
        with:
          version: 0.23.0
      - run: knope prepare-release --verbose
        if: steps.pending.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
