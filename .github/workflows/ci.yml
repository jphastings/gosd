name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  js:
    # Node 22 is both the package's engines floor and the toolchain's real
    # minimum (pnpm 11 needs >= 22.13 for node:sqlite; vite-plus 0.2.x's
    # tsdown bundle calls Promise.withResolvers, also Node 22+), so the
    # matrix's lower leg genuinely tests the oldest supported runtime.
    name: js (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # js/packages/gosd's cross-implementation integration test proves the
      # TypeScript client against a real gosd-built image: `pnpm run
      # genfixture` shells out to `go run ./internal/cmd/injectfixture`, so
      # this job needs a Go toolchain alongside Node, not just Node.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          # pnpm 11 itself needs Node >= 22.13 (it uses node:sqlite);
          # standalone ships pnpm with its own embedded runtime, decoupling
          # the pnpm CLI from the matrix Node the scripts run on.
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:integration

  smoke-build:
    name: cross-compile smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # The image-smoke-build job below now covers the full `gosd build`
      # path (board profiles landed with gosd-3zrc). This job stays as a
      # narrower, faster check that the pure-Go, no-root, arm64 cross-
      # compile path works for the binaries gosd assembles into images.
      - name: Cross-compile arm64 targets (CGO disabled)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/gosd-init ./examples/hello ./examples/usbserial ./examples/i2cscan ./examples/gpioinfo ./examples/spiloopback ./examples/emmcstorage ./examples/diskstorage ./examples/usbwebsite ./examples/chime
      # GOARM=6 is the pi-zero-w board's target (bean gosd-2j6z, keystone for
      # gosd-et0q): a narrower check than the arm64 one above, just proving
      # the 32-bit ARM cross-compile path works for the binaries every board
      # build needs, same as the arm64 check does for the other three boards.
      # examples/i2cscan, examples/gpioinfo, and examples/spiloopback are
      # included here too (beans gosd-85pt, gosd-nyad, gosd-fnza): all three
      # must build for every board, including the 32-bit pi-zero-w.
      # examples/chime (beans gosd-y9hc, gosd-lrxz) is here for a sharper
      # reason: it pulls in the public sound package, which transcribes the
      # ALSA PCM ioctl structs, whose sizes the ioctl request numbers embed
      # and which differ between 32- and 64-bit. That package's compile-time
      # size assertions only get checked for armv6 by this step, so don't
      # drop chime from the list without adding ./sound in its place.
      - name: Cross-compile armv6 targets (CGO disabled)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build ./cmd/gosd-init ./examples/hello ./examples/i2cscan ./examples/gpioinfo ./examples/spiloopback ./examples/emmcstorage ./examples/diskstorage ./examples/usbwebsite ./examples/chime
      - name: Build gosd CLI for host
        run: go build ./cmd/gosd

  image-smoke-build:
    name: image smoke build (both boards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # Go module caching only: the artifact-download cache
          # (internal/artifacts, ~/.cache/gosd or platform equivalent) isn't
          # exercised here on purpose. This job builds against the committed
          # fake artifacts in cmd/gosd/testdata/fake-artifacts via
          # --artifacts-dir specifically so CI never needs network access or
          # a published artifacts/vX.Y.Z release to prove `gosd build`
          # works end to end; there is nothing for that cache to hold in
          # this job. A cache keyed on internal/artifacts.Version would only
          # be worth adding to a future job that builds from a real release.
          cache: true
      # Omitting --board builds every registered board (the repo's locked
      # "no --board builds all boards" decision), so one invocation smoke-
      # tests both pi-zero-2w and radxa-zero-3e. The .img read-back/content
      # assertions already live in cmd/gosd's `go test` integration tests
      # (TestBuildProducesABootableImageFromFakeArtifacts and its
      # radxa-zero-3e counterpart); this job only needs to prove the CLI
      # command itself exits 0 in CI.
      - name: gosd build ./examples/hello (all boards, fake artifacts)
        run: |
          mkdir -p dist
          go run ./cmd/gosd build ./examples/hello \
            --artifacts-dir cmd/gosd/testdata/fake-artifacts \
            -o dist
      - name: Assert both board images were produced
        run: |
          for img in dist/hello-pi-zero-2w.img dist/hello-radxa-zero-3e.img; do
            if [ ! -s "$img" ]; then
              echo "expected non-empty image $img" >&2
              exit 1
            fi
          done

  nix-build:
    name: nix build (flake + vendorHash freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      # This is the mechanism keeping flake.nix's vendorHash in sync with
      # go.mod/go.sum: a dependency change without a matching vendorHash
      # update fails here with nix's "hash mismatch in fixed-output
      # derivation ... got: sha256-..." error — paste that "got:" value
      # into flake.nix. The job also proves the flake-packaged gosd builds
      # and runs at all.
      - name: nix build
        run: nix build --print-build-logs
      - name: Smoke-run the packaged gosd
        run: ./result/bin/gosd --help

  qemu-boot:
    name: qemu boot-to-HTTP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # Unlike image-smoke-build (fake artifacts, no network on purpose),
      # this job exercises the REAL artifact path: no --artifacts-dir, so
      # `gosd build` downloads the qemu-virt kernel from the GitHub Release
      # pinned by internal/artifacts.Version. Until that release is
      # published, this job fails at the build step with the artifact
      # download error — that error names the missing release and is the
      # actionable signal, not a bug in this job.
      - name: Cache downloaded board artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gosd/artifacts
          # internal/artifacts.Version pins which release gets downloaded,
          # so hashing the file that declares it keys the cache to exactly
          # that release: bumping the pinned version invalidates the cache.
          key: gosd-artifacts-${{ hashFiles('internal/artifacts/artifacts.go') }}
      - name: Install qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
          qemu-system-aarch64 --version
      - name: gosd build ./examples/hello --board=qemu-virt (real artifacts)
        run: |
          mkdir -p dist
          go run ./cmd/gosd build ./examples/hello \
            --board=qemu-virt \
            -o dist/hello-qemu-virt.img
      - name: Boot the image and poll until HTTP responds
        run: |
          ./scripts/qemu-run.sh dist/hello-qemu-virt.img > serial.log 2>&1 &
          runner_pid=$!

          # This runner is amd64, so qemu TCG-emulates arm64: boot takes
          # far longer than the ~3s of an arm64 host. 180s is generous
          # headroom, not an expectation.
          # The device names itself after the app: config/hostname ships
          # unset, so config.json's baked default (the main package's name)
          # is what gosd-init falls back to.
          expected="host=hello"
          success=0
          for i in $(seq 1 180); do
            if ! kill -0 "$runner_pid" 2>/dev/null; then
              echo "qemu-run.sh exited before HTTP ever responded" >&2
              break
            fi
            resp="$(curl -s -m 2 http://localhost:8080/ || true)"
            if [ -n "$resp" ] && echo "$resp" | grep -q "$expected"; then
              echo "boot-to-HTTP OK after ~${i}s: $resp"
              success=1
              break
            fi
            sleep 1
          done

          kill "$runner_pid" 2>/dev/null || true
          pkill -f qemu-system-aarch64 2>/dev/null || true

          if [ "$success" -ne 1 ]; then
            echo "::group::Captured serial log"
            cat serial.log
            echo "::endgroup::"
            echo "hello never responded with '$expected' on http://localhost:8080 within 180s" >&2
            exit 1
          fi
      # Free coverage of HCTOSYS's in-kernel RTC-to-system-clock read path
      # (gosd-jyq8/gosd-achn): qemu-virt's PL031 is seeded from the host
      # clock by default (internal/qemurun.Args passes no -rtc override),
      # and the pinned kernel's CONFIG_RTC_HCTOSYS=y/
      # CONFIG_RTC_HCTOSYS_DEVICE="rtc0" copies it into the system clock
      # during kernel init — before gosd-init even starts, so gosd-init
      # itself can never observe or influence this step (see timesync's
      # package doc). The kernel logs it unconditionally very early in
      # boot (confirmed against a real build+boot: "rtc-pl031
      # <addr>.pl031: setting system clock to <ISO8601> UTC (<unix>)"),
      # so this needs no network and can't race gosd-init's own NTP sync
      # the way asserting on timesync's own log line would.
      - name: Verify the PL031 RTC seeded a plausible boot-time clock
        run: |
          line="$(grep -i 'rtc-pl031.*setting system clock to' serial.log || true)"
          if [ -z "$line" ]; then
            echo "::group::Captured serial log"
            cat serial.log
            echo "::endgroup::"
            echo "no PL031 HCTOSYS boot line found in serial.log" >&2
            exit 1
          fi
          echo "kernel boot line: $line"
          year="$(echo "$line" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -c1-4)"
          if [ -z "$year" ] || [ "$year" -lt 2020 ]; then
            echo "::group::Captured serial log"
            cat serial.log
            echo "::endgroup::"
            echo "PL031-seeded boot clock year '$year' looks implausible (expected a real host-seeded date, not epoch)" >&2
            exit 1
          fi
          echo "PL031 read path OK: kernel HCTOSYS seeded the boot clock to $year, straight from the host-seeded RTC"

      # gosd-66ax: with --ingress cloudflared baked in but nothing set in
      # the card's config/ingress/cloudflared/, cloudflared's resolveMode
      # must log its one actionable "baked but not configured" line and
      # nothing else - never start the binary, never loop. A dummy-token
      # supervisor-loop assertion (auth failure against the real Cloudflare
      # edge) is deliberately NOT covered here: it would pin cloudflared's own
      # log wording, an upstream detail this repo doesn't control, for a
      # network expectation (reaching the real edge from a CI runner) this
      # job otherwise avoids entirely - real tunnel establishment is
      # bench-only (see the epic's final bean).
      - name: "gosd run --ingress cloudflared: baked-but-not-configured logs exactly once"
        run: |
          mkdir -p dist
          go build -o dist/gosd-cli ./cmd/gosd

          expected="cloudflared: binary is baked into this image, but nothing is set in config/ingress/cloudflared; nothing to do"
          ./dist/gosd-cli run ./examples/hello --ingress cloudflared > cloudflared.log 2>&1 &
          run_pid=$!

          seen=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$run_pid" 2>/dev/null; then
              echo "gosd run exited before the expected line ever appeared" >&2
              break
            fi
            if grep -qF "$expected" cloudflared.log; then
              seen=1
              break
            fi
            sleep 1
          done

          kill "$run_pid" 2>/dev/null || true
          wait "$run_pid" 2>/dev/null || true

          got=$(grep -cF "$expected" cloudflared.log || true)
          if [ "$seen" -ne 1 ] || [ "$got" -ne 1 ]; then
            echo "::group::Captured gosd run output"
            cat cloudflared.log
            echo "::endgroup::"
            echo "want exactly one \"baked but not configured\" line, got $got (seen=$seen)" >&2
            exit 1
          fi

      # gosd-o68e: with --ingress tailscale-funnel baked in but nothing set
      # in the card's config/ingress/tailscale-funnel/, tsfunnel's own
      # resolveMode must log its one actionable "baked but not configured"
      # line and nothing else - never start the shim, never loop. --data-size
      # is required here: tailscale-funnel refuses to build with no data
      # partition (bean gosd-kzd3), since it has nowhere to persist its
      # tailnet identity. A dummy-authkey supervisor-loop assertion (a real
      # registration attempt against Tailscale's control plane) is
      # deliberately NOT covered here, for the same class of reasons
      # gosd-66ax gave for cloudflared's equivalent case above (a genuine
      # network expectation beyond what this job otherwise needs, and an
      # upstream error-wording detail this repo doesn't control) plus a
      # stronger one specific to this agent: an ingress secret is never
      # baked at build/run time by design - the card's
      # config/ingress/tailscale-funnel/authkey ships empty - so reaching
      # that code path at all would need new image-editing tooling this bean
      # doesn't add. Real invalid-authkey behavior (error
      # vs hang, bounded by --register-timeout) is uncharacterized until TS-8
      # (bean gosd-79v8) - real tunnel establishment is bench-only, same as
      # cloudflared's.
      - name: "gosd run --ingress tailscale-funnel: baked-but-not-configured logs exactly once"
        run: |
          expected="tailscale-funnel: binary is baked into this image, but nothing is set in config/ingress/tailscale-funnel; nothing to do"
          ./dist/gosd-cli run ./examples/hello --ingress tailscale-funnel --data-size 64MiB > tsfunnel.log 2>&1 &
          run_pid=$!

          seen=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$run_pid" 2>/dev/null; then
              echo "gosd run exited before the expected line ever appeared" >&2
              break
            fi
            if grep -qF "$expected" tsfunnel.log; then
              seen=1
              break
            fi
            sleep 1
          done

          kill "$run_pid" 2>/dev/null || true
          wait "$run_pid" 2>/dev/null || true

          got=$(grep -cF "$expected" tsfunnel.log || true)
          if [ "$seen" -ne 1 ] || [ "$got" -ne 1 ]; then
            echo "::group::Captured gosd run output"
            cat tsfunnel.log
            echo "::endgroup::"
            echo "want exactly one \"baked but not configured\" line, got $got (seen=$seen)" >&2
            exit 1
          fi

  # Proves --data-size=expand end-to-end on the real boot path: the image
  # ships with no data partition, the "card" (the raw image file, enlarged
  # after the build, exactly as flashing onto a bigger SD card leaves it)
  # gains a data partition on first boot, and the second boot finds it
  # and leaves it alone. Killing qemu after the first boot doubles as a
  # power-cut: everything the second boot depends on must already be durable.
  # The third boot follows a re-flash of the very same image over the front
  # of the card, and must re-adopt the partition the flash orphaned rather
  # than reformat it (docs/design/upgrade-path.md §2).
  qemu-expand-data:
    name: qemu first-boot data-partition expansion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache downloaded board artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gosd/artifacts
          key: gosd-artifacts-${{ hashFiles('internal/artifacts/artifacts.go') }}
      - name: Install qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
      - name: gosd build ./examples/hello --data-size=expand, onto a bigger "card"
        run: |
          mkdir -p dist
          go run ./cmd/gosd build ./examples/hello \
            --board=qemu-virt \
            --data-size=expand \
            -o dist/hello-qemu-virt.img
          # Kept aside as the flasher's copy, for the re-flash step below.
          cp dist/hello-qemu-virt.img dist/flashable.img
          # The image is 272MiB; a real card is bigger. truncate models
          # flashing onto a 1.27GiB card (raw qemu disks may be sparse).
          truncate -s +1G dist/hello-qemu-virt.img
      # The provisioning snapshot (docs/design/upgrade-path.md §3) is written
      # to the data partition as soon as there is one, so this boot is also
      # the proof it reaches a real FAT filesystem rather than only the fakes
      # in provsnapshot's unit tests.
      - name: "First boot: creates, formats and mounts the data partition"
        run: |
          # "as FAT32 labelled hello-data" is the end-to-end proof that
          # config.json's dataLabel (bean gosd-lo7k's per-app labels)
          # reaches a real on-device format, not just the unit-test fakes.
          ./scripts/boot-and-grep.sh dist/hello-qemu-virt.img first.log \
            "data partition created, filling the card" \
            "as FAT32 labelled hello-data" \
            "data partition mounted read-write at /data" \
            "provisioning snapshot saved"
      # boots=2 is the durability assertion (bean gosd-0nk4): the first
      # boot's counter write was seconds old when qemu was killed, so it
      # only reads back here if hello's write-fsync-rename really reached
      # the card instead of waiting for writeback expiry.
      - name: "Second boot: finds the partition, and last boot's write survived"
        run: |
          ./scripts/boot-and-grep.sh dist/hello-qemu-virt.img second.log \
            "data partition already present" \
            "data partition mounted read-write at /data" \
            "provisioning snapshot unchanged" \
            "boots=2"
      # An upgrade, as an operator performs it: Imager writes the image over
      # the front of the card and stops at its end, so the MBR loses
      # partition 2's entry while the data region beyond it is never
      # touched. boots=3 is the proof the app's data came back — a reformat
      # would have restarted the counter at 1.
      - name: "Re-flash: the orphaned data partition is re-adopted, not reformatted"
        run: |
          dd if=dist/flashable.img of=dist/hello-qemu-virt.img conv=notrunc
          ./scripts/boot-and-grep.sh dist/hello-qemu-virt.img reflash.log \
            "data partition re-adopted" \
            "data partition mounted read-write at /data" \
            "boots=3"
      - name: "Corrupted established partition: halts instead of repairing"
        run: |
          # Zero the filesystem out from under the established partition
          # (2048 sectors from its locked 272MiB start). The boot must
          # refuse to touch it, record LAST_FATAL_ERROR.md, and halt — the
          # app must never start. The "recorded this failure" line only
          # prints once the write returned: it is this job's proof that the
          # remount-rw → write → fsync → remount-ro path really works
          # against a live vfat boot partition, not just against fakes.
          dd if=/dev/zero of=dist/hello-qemu-virt.img bs=512 seek=557056 count=2048 conv=notrunc
          BOOT_WAIT_FOR="halting" ./scripts/boot-and-grep.sh dist/hello-qemu-virt.img corrupt.log \
            "fatal: the data partition is corrupt" \
            "halting" \
            "recorded this failure to LAST_FATAL_ERROR.md"
          if grep -q "host=" corrupt.log; then
            echo "the app started despite a corrupt data partition" >&2
            exit 1
          fi

  # The data-partition counterpart of qemu-disk-ext4, for `gosd build
  # --data-filesystem=ext4` (bean gosd-95yu). Unlike FAT32, an ext4 data
  # partition ships as internal/diskfmt/ext4golden's fixed 512MiB image and
  # is grown to the partition's real size exactly once on first boot, so
  # both --data-size shapes need proving on the real boot path:
  #
  #   * expand: the partition is created, formatted, grown and established
  #     on first boot, then re-adopted after a re-flash orphans it — the
  #     upgrade path an operator actually performs (docs/design/upgrade-path.md).
  #   * a fixed size: the image already carries the golden filesystem and an
  #     MBR entry, so first boot's only job is the one-time grow.
  #
  # Every boot here ends the way qemu-expand-data's do: boot-and-grep.sh
  # kills qemu without a clean shutdown, so each "boots=N" that survives is
  # a power-cut assertion, not just a restart — and for ext4 specifically it
  # exercises journal replay on the following mount.
  qemu-data-ext4:
    name: "qemu ext4 /data: grow, crash-safe adoption, re-flash re-adoption"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache downloaded board artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gosd/artifacts
          key: gosd-artifacts-${{ hashFiles('internal/artifacts/artifacts.go') }}
      - name: Install qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
      - name: gosd build ./examples/hello --data-filesystem=ext4 --data-size=expand
        run: |
          mkdir -p dist
          go run ./cmd/gosd build ./examples/hello \
            --board=qemu-virt \
            --data-filesystem=ext4 \
            --data-size=expand \
            -o dist/expand.img
          # The flasher's pristine copy, for the re-flash step below.
          cp dist/expand.img dist/expand-flashable.img
          # Model flashing onto a card bigger than the image. 1GiB of slack
          # is comfortably past ext4golden's fixed 512MiB, so the grow is a
          # real grow rather than a no-op.
          truncate -s +2G dist/expand.img
      - name: "First boot: creates, formats, grows and mounts the ext4 data partition"
        run: |
          # "as ext4 labelled hello-data" mirrors qemu-expand-data's label
          # assertion: the baked per-app label reaches the ext4 route too.
          ./scripts/boot-and-grep.sh dist/expand.img expand-first.log \
            "data partition created, filling the card" \
            "as ext4 labelled hello-data" \
            "data partition mounted read-write at /data"
      # boots=2 is the durability assertion: the previous boot's counter
      # write was seconds old when qemu was killed, so it only reads back
      # here if hello's write-fsync-rename reached the card — through ext4's
      # journal this time — instead of waiting for writeback expiry.
      - name: "Second boot: already established, and last boot's write survived"
        run: |
          ./scripts/boot-and-grep.sh dist/expand.img expand-second.log \
            "data partition already present" \
            "data partition mounted read-write at /data" \
            "boots=2"
      # The case bean gosd-95yu exists to preserve for ext4: Imager writes
      # the image over the front of the card and stops at its end, so the
      # MBR loses partition 2's entry while the data region beyond it is
      # never touched. boots=3 is the proof the app's data came back — a
      # reformat would have restarted the counter at 1.
      - name: "Re-flash: the orphaned ext4 data partition is re-adopted, not reformatted"
        run: |
          dd if=dist/expand-flashable.img of=dist/expand.img conv=notrunc
          ./scripts/boot-and-grep.sh dist/expand.img expand-reflash.log \
            "data partition re-adopted" \
            "data partition mounted read-write at /data" \
            "boots=3"
      # A fixed --data-size ships the golden filesystem and its MBR entry
      # already written, so first boot has exactly one job the FAT32
      # equivalent never had: growing 512MiB up to the partition's size.
      # Two boots prove it happened once and left something durable.
      - name: gosd build ./examples/hello --data-filesystem=ext4 --data-size=1GiB
        run: |
          go run ./cmd/gosd build ./examples/hello \
            --board=qemu-virt \
            --data-filesystem=ext4 \
            --data-size=1GiB \
            -o dist/fixed.img
      - name: "First boot: grows the shipped 512MiB filesystem to the partition"
        run: |
          ./scripts/boot-and-grep.sh dist/fixed.img fixed-first.log \
            "data partition mounted read-write at /data"
      - name: "Second boot: established, no second grow, and the write survived"
        run: |
          ./scripts/boot-and-grep.sh dist/fixed.img fixed-second.log \
            "data partition mounted read-write at /data" \
            "boots=2"

  # Proves ext4 is genuinely disk/'s default (Options{}'s zero value, not an
  # explicit disk.EXT4 token) end to end on the real boot path: a second,
  # blank virtio disk — attached only to qemu for this job, never part of
  # the built image — is formatted from internal/diskfmt/ext4golden's image
  # and grown to its own size on first boot, survives qemu being
  # hard-killed (boot-and-grep.sh's kill/pkill sends the qemu process no
  # clean-shutdown signal, doubling as a power cut exactly as
  # qemu-expand-data's does), and comes back adopted rather than
  # reformatted on the very next boot — the counter file in
  # examples/diskstorage only reaches "2" if last boot's fsync'd write
  # (docs/runtime.md's four-step pattern) survived the journal replay.
  # Mirrors qemu-expand-data's shape. (gosd-vag9 brought qemu-boot and
  # qemu-expand-data up to this job's pre-existing SHA-pinning discipline.)
  qemu-disk-ext4:
    name: "qemu ext4 disk default: format, grow, crash-safe adoption"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache downloaded board artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gosd/artifacts
          key: gosd-artifacts-${{ hashFiles('internal/artifacts/artifacts.go') }}
      - name: Install qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
      - name: gosd build ./examples/diskstorage --board=qemu-virt (real artifacts)
        run: |
          mkdir -p dist
          go run ./cmd/gosd build ./examples/diskstorage \
            --board=qemu-virt \
            -o dist/diskstorage-qemu-virt.img
      # A few GiB, sparse, well past ext4golden's fixed 512MiB image so the
      # "grew, not golden" assertion below is unambiguous — and cheap to
      # create/attach since qemu never reads the unwritten tail.
      - name: Create a second, blank virtio disk
        run: truncate -s 2G dist/disk2.img
      - name: "First boot: formats the second disk as ext4 (the zero-value default) and grows it"
        run: |
          export QEMU_EXTRA_ARGS=$'-drive\nif=none,file=dist/disk2.img,format=raw,id=hd1\n-device\nvirtio-blk-pci,drive=hd1,romfile='
          ./scripts/boot-and-grep.sh dist/diskstorage-qemu-virt.img first.log \
            "gosd disk: DISKTEST ready at /storage (device /dev/vdb)" \
            "gosd disk: boots=1"
      - name: "Assert the grow ran: filesystem size tracks the 2GiB disk, not the 512MiB golden image"
        run: ./scripts/assert-disk-grew.sh first.log
      # Hard-killing qemu (boot-and-grep.sh's kill/pkill, no guest shutdown)
      # doubles as a power cut, same as qemu-expand-data: everything the
      # second boot depends on — the golden-image write, the grow, and the
      # establishment marker (internal/blockmount's EXT4EstablishedMarker) —
      # must already be durable on the disk.
      - name: "Second boot: same two disks, hard-killed and rebooted — adopts, does not reformat"
        run: |
          export QEMU_EXTRA_ARGS=$'-drive\nif=none,file=dist/disk2.img,format=raw,id=hd1\n-device\nvirtio-blk-pci,drive=hd1,romfile='
          ./scripts/boot-and-grep.sh dist/diskstorage-qemu-virt.img second.log \
            "gosd disk: DISKTEST ready at /storage (device /dev/vdb)" \
            "gosd disk: boots=2"
      - name: "Assert the grown size persisted through adoption (no re-grow, no reformat)"
        run: ./scripts/assert-disk-grew.sh second.log
